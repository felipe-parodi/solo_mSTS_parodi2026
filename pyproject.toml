[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-msts-parodi2026"
version = "1.0.0"
description = "Analysis code for: Mid-superior temporal sulcus encodes spatial context and behavioral state in freely moving macaques"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Felipe Parodi"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "statsmodels>=0.14",
    "tqdm>=4.60",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0,<2.4",
    "numba>=0.58",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["freemat*", "freemat_data*", "analysis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
