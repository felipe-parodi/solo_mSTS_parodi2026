# Centralized channel bank mapping and subject-specific exclusions.
#
# Conventions:
# - Channels are Deuteron IDs (0-indexed) unless otherwise noted.
# - Use the structured keys below for current workflows.
# - Legacy values are preserved under the "legacy" block for reference.

# Primary bank mapping (0-indexed Deuteron IDs)
ventral_channels: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 76, 80, 84, 88, 92, 96, 100, 104, 108, 112, 116, 120, 124, 125, 121, 117, 113, 109, 105, 101, 97, 93, 89, 85, 81, 77, 73, 69, 65, 61, 57, 53, 49, 45, 41, 37, 33, 29, 25, 21, 17, 13, 9, 5, 1]
dorsal_channels: [2, 3, 6, 7, 10, 11, 14, 15, 18, 19, 22, 23, 26, 27, 30, 31, 34, 35, 38, 39, 42, 43, 46, 47, 50, 51, 54, 55, 58, 59, 62, 63, 66, 67, 70, 71, 74, 75, 78, 79, 82, 83, 86, 87, 90, 91, 94, 95, 98, 99, 102, 103, 106, 107, 110, 111, 114, 115, 118, 119, 122, 123, 126, 127]

# Compatibility keys used by freemat_data.banks (0-indexed Deuteron IDs)
hedy_exclude: []
hooke_exclude: [92, 76, 33, 108, 1, 72, 124, 49, 65, 12, 56, 113, 28, 81, 60, 44, 67, 14, 58, 115, 30, 83, 62, 46]

# Structured per-subject exclusions (0-indexed Deuteron IDs)
# broken_shank: Physical damage (manual identification)
# chronic_bad: Data-driven (>50% sessions flagged bad in cross-session analysis)
# car_exclude: Union of broken_shank + chronic_bad (used for CAR preprocessing)
subject_exclude:
  hedy:
    broken_shank_0_idx: []
    chronic_bad_0_idx: [126]  # From cross-session analysis (88% bad rate)
    car_exclude_0_idx: [126]  # Union of broken + chronic
    session_overrides: {}
  hooke:
    broken_shank_0_idx: [92, 76, 33, 108, 1, 72, 124, 49, 65, 12, 56, 113, 28, 81, 60, 44, 67, 14, 58, 115, 30, 83, 62, 46]
    chronic_bad_0_idx: [3, 23, 126]  # From cross-session analysis (70% threshold)
    # car_exclude = sorted(set(broken_shank) | set(chronic_bad))
    car_exclude_0_idx: [1, 3, 12, 14, 23, 28, 30, 33, 44, 46, 49, 56, 58, 60, 62, 65, 67, 72, 76, 81, 83, 92, 108, 113, 115, 124, 126]
    session_overrides: {}

# Probe physical specifications (NeuroNexus M4x8-6mm-550-500-177)
# - 4 shanks × 8 electrodes per probe
# - 6 mm shank length
# - 550 µm inter-contact distance (between electrodes on same shank)
# - 500 µm inter-shank distance (between shank tips)
# - 177 µm² contact area per electrode
# - 4 × 800 µm platform size
probe_geometry:
  model: "M4x8-6mm-550-500-177"
  n_shanks: 4
  n_electrodes_per_shank: 8
  shank_length_um: 6000
  inter_contact_um: 550
  inter_shank_um: 500
  contact_area_um2: 177
  platform_size_um: [4, 800]
  platform_spacing_um: 800  # AP distance between anterior and posterior platforms
  dual_cable_length_mm: 35

# Shank groupings for per-shank whitening
# Derived from configs/bank_shank_breakdown.csv
# Each shank has 8 electrodes; 4 shanks per bank; 2 banks per region
# IMPORTANT: Order is preserved from CSV (top-to-bottom on shank, position 1-8)
# This spatial order matters for whitening - adjacent indices are physically closer
shank_groups: # these are 0-indexed Deuteron IDs
  # Ventral Bank 1 (A1) - 32 channels, positions 1-8 (top to bottom)
  a1_shank1: [57, 116, 64, 9, 100, 41, 68, 84]      # NN: 8,7,6,5,4,3,2,1
  a1_shank2: [61, 45, 112, 96, 29, 80, 25, 13]     # NN: 17,15,14,13,12,11,10,9
  a1_shank3: [125, 105, 32, 109, 16, 0, 93, 77]    # NN: 26,21,22,23,18,19,20,16
  a1_shank4: [36, 52, 89, 20, 121, 48, 4, 73]      # NN: 30,31,32,27,28,29,24,25
  # Ventral Bank 2 (A2) - 32 channels
  a2_shank1: [49, 124, 72, 1, 108, 33, 76, 92]     # NN: 40,39,38,37,36,35,34,33
  a2_shank2: [53, 37, 120, 104, 21, 88, 17, 5]    # NN: 49,47,46,45,44,43,42,41
  a2_shank3: [117, 97, 40, 101, 24, 8, 85, 69]    # NN: 58,53,54,55,50,51,52,48
  a2_shank4: [44, 60, 81, 28, 113, 56, 12, 65]    # NN: 62,63,64,59,60,61,56,57
  # Dorsal Bank 1 (B1) - 32 channels
  b1_shank1: [59, 118, 66, 11, 102, 43, 70, 86]   # NN: 72,71,70,69,68,67,66,65
  b1_shank2: [63, 47, 114, 98, 31, 82, 27, 15]    # NN: 81,79,78,77,76,75,74,73
  b1_shank3: [127, 107, 34, 111, 18, 2, 95, 79]   # NN: 90,85,86,87,82,83,84,80
  b1_shank4: [38, 54, 91, 22, 123, 50, 6, 75]     # NN: 94,95,96,91,92,93,88,89
  # Dorsal Bank 2 (B2) - 32 channels
  b2_shank1: [51, 126, 74, 3, 110, 35, 78, 94]    # NN: 104,103,102,101,100,99,98,97
  b2_shank2: [55, 39, 122, 106, 23, 90, 19, 7]    # NN: 113,111,110,109,108,107,106,105
  b2_shank3: [119, 99, 42, 103, 26, 10, 87, 71]   # NN: 122,117,118,119,114,115,116,112
  b2_shank4: [46, 62, 83, 30, 115, 58, 14, 67]    # NN: 126,127,128,123,124,125,120,121

# Shank groupings by region (convenience lists)
ventral_shanks:
  - a1_shank1
  - a1_shank2
  - a1_shank3
  - a1_shank4
  - a2_shank1
  - a2_shank2
